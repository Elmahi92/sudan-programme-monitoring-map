name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate dashboard files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f UI_Assests/map-dashboard.html
          test -f UI_Assests/dashboard.js
          test -f Geo_Data/M_E_masterdata_by_state.geojson
          test -f Geo_Data/sdn_admbnda_adm1_cbs_nic_ssa_download.geojson
          python -m json.tool Geo_Data/M_E_masterdata_by_state.geojson >/dev/null
          python -m json.tool Geo_Data/sdn_admbnda_adm1_cbs_nic_ssa_download.geojson >/dev/null

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4